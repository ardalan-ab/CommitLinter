name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages after building and checking them
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: commit-linter-rs-linux-x64
          - runner: ubuntu-24.04-arm
            artifact: commit-linter-rs-linux-arm64
          - runner: macos-15-intel
            artifact: commit-linter-rs-macos-x64
          - runner: macos-14
            artifact: commit-linter-rs-macos-arm64
          - runner: windows-latest
            artifact: commit-linter-rs-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p commit-linter-cli
      - name: Stage Unix binary
        if: runner.os != 'Windows'
        run: cp target/release/commit-linter-rs "${{ matrix.artifact }}"
      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/release/commit-linter-rs.exe "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: native
          merge-multiple: true
      - name: Install binaries in wrappers
        run: |
          for directory in packages/node/vendor packages/python/commit_linter_rs/vendor packages/php/vendor-bin packages/flutter/lib/vendor; do
            mkdir -p "$directory"
            cp native/* "$directory/"
            chmod +x "$directory"/commit-linter-rs-linux-* "$directory"/commit-linter-rs-macos-*
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dart-lang/setup-dart@v1
      - run: python -m pip install build twine
      - name: Resolve and check version
        run: |
          VERSION=$(node -p "require('./packages/node/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
          bash scripts/check-release.sh "$VERSION"
      - run: python -m build packages/python
      - run: python -m twine check packages/python/dist/*
      - name: Validate Dart package
        run: |
          cp -a packages/flutter "$RUNNER_TEMP/flutter"
          cd "$RUNNER_TEMP/flutter"
          dart pub get
          dart analyze
          dart pub publish --dry-run
      - run: mkdir -p packages/node/dist && npm pack ./packages/node --pack-destination packages/node/dist
      - name: Build Composer archive
        run: tar -C packages/php -czf packages/php/commit-linter-rs-$VERSION.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: registry-packages
          path: |
            packages/node/dist/*
            packages/python/dist/*
            packages/php/*.tar.gz
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/*
            packages/node/dist/*
            packages/python/dist/*
            packages/php/*.tar.gz
      - name: Publish npm
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: npm publish packages/node/dist/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish PyPI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
      - name: Publish pub.dev
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        working-directory: packages/flutter
        run: dart pub publish --force

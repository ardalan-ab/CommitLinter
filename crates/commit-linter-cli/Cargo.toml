[package]
name = "commit-linter-cli"
version = "0.1.0"
edition = "2021"
description = "Universal Conventional Commit message linter"
license = "MIT"

[[bin]]
name = "commit-linter-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-linter-rs"
version = "0.1.0"
description = "Python launcher for the commit-linter-rs Rust CLI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
commit-linter-rs = "commit_linter_rs.cli:main"

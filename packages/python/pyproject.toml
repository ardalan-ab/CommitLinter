[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-linter-rs"
version = "0.1.0"
description = "Project-local Python launcher for the commit-linter-rs Rust CLI"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["commit", "lint", "conventional-commits", "git-hook", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/ardalan-ab/CommitLinter"
Repository = "https://github.com/ardalan-ab/CommitLinter"
Issues = "https://github.com/ardalan-ab/CommitLinter/issues"

[project.scripts]
commit-linter-rs = "commit_linter_rs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["commit_linter_rs"]
artifacts = ["commit_linter_rs/vendor/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["commit_linter_rs/vendor/*"]
